---
# yamllint disable rule:line-length
name: codecov
'on':
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
jobs:
  codecov:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: 25
          check-latest: true
      - uses: ./.github/actions/setup-maven
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-
      - name: Install LaTeX and Netpbm
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            ghostscript netpbm
      - name: Log resolved Java and Maven versions
        run: |
          java -XshowSettings:properties -version
          javac -version
          mvn --version
          mvn --version | grep -F 'Apache Maven 3.10.0'
      - run: mvn --errors --batch-mode clean install -Pqulice,jacoco
      - name: Verify LaTeX outputs and coverage XML
        run: |
          test -s target/it/simple/target/site/latex/picture.png
          test -s target/it/simple/target/site/latex/big-picture.png
          test -s target/site/jacoco/jacoco.xml
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          report = ET.parse('target/site/jacoco/jacoco.xml').getroot()
          assert report.tag == 'report'
          counter = report.find("./counter[@type='INSTRUCTION']")
          assert counter is not None and int(counter.attrib['covered']) > 0
          PYTHON
      - uses: codecov/codecov-action@v7
        if: github.event_name == 'push'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
