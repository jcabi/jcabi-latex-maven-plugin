---
# yamllint disable rule:line-length
name: mvn
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  mvn:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
        java: [21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          check-latest: true
      - uses: ./.github/actions/setup-maven
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-${{ matrix.java }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-jdk-${{ matrix.java }}-maven-
      - name: Install LaTeX and Netpbm
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            ghostscript netpbm
      - name: Log resolved Java and Maven versions
        shell: bash
        run: |
          java -XshowSettings:properties -version
          javac -version
          mvn --version
          mvn --version | grep -F 'Apache Maven 3.10.0'
      - run: mvn --errors --batch-mode clean install -Pqulice
      - name: Verify Linux LaTeX outputs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -s target/it/simple/target/site/latex/picture.png
          test -s target/it/simple/target/site/latex/big-picture.png
